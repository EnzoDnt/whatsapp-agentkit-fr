<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulateur WhatsApp — AgentKit FR</title>
<style>
  :root{
    --fond:#0b141a; --panneau:#111b21; --barre:#202c33; --bulle-moi:#005c4b;
    --bulle-agent:#202c33; --texte:#e9edef; --discret:#8696a0; --accent:#25d366;
    --trame:#0b141a;
  }
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0a0f13;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;
       color:var(--texte)}
  .tel{width:min(430px,96vw);height:min(860px,96vh);display:flex;flex-direction:column;
       background:var(--panneau);border-radius:14px;overflow:hidden;
       box-shadow:0 24px 70px rgba(0,0,0,.6)}
  header{background:var(--barre);padding:12px 16px;display:flex;align-items:center;gap:12px;flex:0 0 auto}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#04231a;
          display:grid;place-items:center;font-weight:700;font-size:17px}
  .titre{font-weight:600;font-size:15px;line-height:1.25}
  .sous{font-size:12px;color:var(--discret)}
  #reinit{margin-left:auto;background:none;border:1px solid #3a4a53;color:var(--discret);
          border-radius:7px;padding:6px 11px;font-size:12px;cursor:pointer}
  #reinit:hover{color:var(--texte);border-color:var(--discret)}
  #fil{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:8px;
       background-color:var(--trame);
       background-image:radial-gradient(rgba(255,255,255,.022) 1px,transparent 1px);
       background-size:22px 22px}
  .bulle{max-width:78%;padding:8px 11px;border-radius:9px;font-size:14.5px;line-height:1.45;
         white-space:pre-wrap;word-wrap:break-word;animation:apparait .18s ease-out}
  @keyframes apparait{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .moi{align-self:flex-end;background:var(--bulle-moi);border-bottom-right-radius:2px}
  .agent{align-self:flex-start;background:var(--bulle-agent);border-bottom-left-radius:2px}
  .heure{display:block;font-size:10.5px;color:rgba(233,237,239,.55);text-align:right;margin-top:3px}
  .systeme{align-self:center;background:#182229;color:var(--discret);font-size:12px;
           padding:6px 13px;border-radius:8px;max-width:88%;text-align:center}
  .attente{align-self:flex-start;background:var(--bulle-agent);padding:11px 14px;border-radius:9px;display:flex;gap:4px}
  .attente i{width:7px;height:7px;border-radius:50%;background:var(--discret);animation:rebond 1.3s infinite}
  .attente i:nth-child(2){animation-delay:.15s}.attente i:nth-child(3){animation-delay:.3s}
  @keyframes rebond{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
  footer{background:var(--barre);padding:10px;display:flex;gap:9px;flex:0 0 auto}
  #saisie{flex:1;background:#2a3942;border:none;border-radius:20px;padding:11px 16px;
          color:var(--texte);font-size:14.5px;outline:none;font-family:inherit}
  #envoyer{width:42px;height:42px;border-radius:50%;border:none;background:var(--accent);
           color:#04231a;font-size:18px;cursor:pointer;flex:0 0 auto}
  #envoyer:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<div class="tel">
  <header>
    <div class="avatar" id="initiale">A</div>
    <div>
      <div class="titre" id="nom-agent">Votre agent</div>
      <div class="sous" id="etat">connexion…</div>
    </div>
    <button id="reinit" title="Efface l'historique de cette conversation">Réinitialiser</button>
  </header>
  <div id="fil">
    <div class="systeme">Simulateur local — les messages passent par le vrai webhook, signés comme chez Meta.</div>
  </div>
  <footer>
    <input id="saisie" placeholder="Écrivez comme un client…" autocomplete="off">
    <button id="envoyer" title="Envoyer">➤</button>
  </footer>
</div>
<script>
const fil = document.getElementById('fil'), saisie = document.getElementById('saisie'),
      bouton = document.getElementById('envoyer'), etat = document.getElementById('etat');
let index = 0, attenteEl = null;

const heure = () => new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});

function bulle(texte, classe){
  const d = document.createElement('div');
  d.className = 'bulle ' + classe;
  d.textContent = texte;
  const h = document.createElement('span');
  h.className = 'heure'; h.textContent = heure();
  d.appendChild(h);
  fil.appendChild(d); fil.scrollTop = fil.scrollHeight;
}
function systeme(texte){
  const d = document.createElement('div');
  d.className = 'systeme'; d.textContent = texte;
  fil.appendChild(d); fil.scrollTop = fil.scrollHeight;
}
function attente(actif){
  if(actif && !attenteEl){
    attenteEl = document.createElement('div');
    attenteEl.className = 'attente';
    attenteEl.innerHTML = '<i></i><i></i><i></i>';
    fil.appendChild(attenteEl); fil.scrollTop = fil.scrollHeight;
  } else if(!actif && attenteEl){ attenteEl.remove(); attenteEl = null; }
}

async function sante(){
  try{
    const r = await fetch('/'); const d = await r.json();
    if(d.statut === 'erreur'){ etat.textContent = 'configuration incomplète'; systeme(d.detail); return; }
    etat.textContent = 'en ligne · ' + (d.fournisseur || '?');
  }catch{ etat.textContent = 'serveur injoignable'; }
}

async function sonder(){
  try{
    const r = await fetch('/simulateur/messages?depuis=' + index);
    const d = await r.json();
    if(d.messages.length){
      attente(false);
      d.messages.forEach(m => bulle(m.texte, 'agent'));
      index = d.index;
      bouton.disabled = false;
    }
  }catch{}
}

async function envoyer(){
  const texte = saisie.value.trim(); if(!texte) return;
  saisie.value = ''; bulle(texte, 'moi'); bouton.disabled = true; attente(true);
  try{
    const r = await fetch('/simulateur/envoyer', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({texte})
    });
    if(!r.ok){
      attente(false); bouton.disabled = false;
      const e = await r.json().catch(()=>({}));
      systeme('Erreur ' + r.status + (e.detail ? ' — ' + e.detail : ''));
    }
  }catch(e){ attente(false); bouton.disabled = false; systeme('Serveur injoignable.'); }
}

bouton.onclick = envoyer;
saisie.addEventListener('keydown', e => { if(e.key === 'Enter') envoyer(); });
document.getElementById('reinit').onclick = async () => {
  await fetch('/simulateur/reinitialiser', {method:'POST'});
  fil.innerHTML = ''; index = 0;
  systeme('Conversation réinitialisée. L\'agent a oublié cet échange.');
};

sante(); setInterval(sonder, 900); saisie.focus();
</script>
</body>
</html>
